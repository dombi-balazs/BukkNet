<div class="relative inline-block text-left">
  <button
    type="button"
    (click)="toggleMenu()"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="listbox"
    aria-label="Language selector"
    class="inline-flex items-center gap-2 rounded-lg border border-[#434c5e] bg-[#3b4252] px-3 py-2 text-sm font-medium text-[#d8dee9]
           hover:text-[#eceff4] hover:bg-[#434c5e] active:bg-[#4c566a]
           focus:outline-none focus:border-[#88c0d0] transition-colors duration-200 whitespace-nowrap cursor-pointer">
    @if (currentLang() === 'hu') {
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 3 2"
        class="h-3.5 w-5 shrink-0 rounded-[2px] block"
        role="img"
        aria-label="HU">
        <rect width="3" height="2" fill="#bf616a" />
        <rect width="3" height="1.3333" y="0.6667" fill="#eceff4" />
        <rect width="3" height="0.6667" y="1.3333" fill="#a3be8c" />
      </svg>
    } @else {
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 810 540"
        class="h-3.5 w-5 shrink-0 rounded-[2px] block"
        role="img"
        aria-label="EN">
        <rect width="810" height="540" fill="#5e81ac" />
        <g fill="#ebcb8b" transform="translate(405,270)">
          <g id="eu-star-btn" transform="translate(0,-180)">
            <polygon points="0,-27 7.9,-8.5 28,-6.7 12.7,6.5 17.3,26.1 0,15.7 -17.3,26.1 -12.7,6.5 -28,-6.7 -7.9,-8.5" />
          </g>
          <use href="#eu-star-btn" transform="rotate(30)" />
          <use href="#eu-star-btn" transform="rotate(60)" />
          <use href="#eu-star-btn" transform="rotate(90)" />
          <use href="#eu-star-btn" transform="rotate(120)" />
          <use href="#eu-star-btn" transform="rotate(150)" />
          <use href="#eu-star-btn" transform="rotate(180)" />
          <use href="#eu-star-btn" transform="rotate(210)" />
          <use href="#eu-star-btn" transform="rotate(240)" />
          <use href="#eu-star-btn" transform="rotate(270)" />
          <use href="#eu-star-btn" transform="rotate(300)" />
          <use href="#eu-star-btn" transform="rotate(330)" />
        </g>
      </svg>
    }

    <svg
      class="h-4 w-4 text-[#d8dee9] transition-transform duration-200"
      [class.rotate-180]="isOpen()"
      viewBox="0 0 20 20"
      fill="currentColor"
      aria-hidden="true">
      <path
        fill-rule="evenodd"
        d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"
        clip-rule="evenodd" />
    </svg>
  </button>

  @if (isOpen()) {
    <div
      role="listbox"
      class="absolute right-0 z-50 mt-1.5 flex w-fit min-w-full flex-col gap-1.5 overflow-hidden rounded-lg border border-[#434c5e] bg-[#2e3440] p-1.5">
      <button
        type="button"
        role="option"
        [attr.aria-selected]="currentLang() === 'hu'"
        (click)="selectLanguage('hu')"
        [class.bg-[#3b4252]]="currentLang() === 'hu'"
        [class.text-[#eceff4]]="currentLang() === 'hu'"
        class="flex w-full items-center justify-center rounded-lg px-2.5 py-2 text-sm text-[#d8dee9]
               hover:text-[#eceff4] hover:bg-[#3b4252] active:bg-[#434c5e]
               transition-colors duration-200 cursor-pointer">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 3 2"
          class="h-3.5 w-5 shrink-0 rounded-[2px] block"
          role="img"
          aria-label="HU">
          <rect width="3" height="2" fill="#bf616a" />
          <rect width="3" height="1.3333" y="0.6667" fill="#eceff4" />
          <rect width="3" height="0.6667" y="1.3333" fill="#a3be8c" />
        </svg>
      </button>

      <button
        type="button"
        role="option"
        [attr.aria-selected]="currentLang() === 'en'"
        (click)="selectLanguage('en')"
        [class.bg-[#3b4252]]="currentLang() === 'en'"
        [class.text-[#eceff4]]="currentLang() === 'en'"
        class="flex w-full items-center justify-center rounded-lg px-2.5 py-2 text-sm text-[#d8dee9]
               hover:text-[#eceff4] hover:bg-[#3b4252] active:bg-[#434c5e]
               transition-colors duration-200 cursor-pointer">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 810 540"
          class="h-3.5 w-5 shrink-0 rounded-[2px] block"
          role="img"
          aria-label="EN">
          <rect width="810" height="540" fill="#5e81ac" />
          <g fill="#ebcb8b" transform="translate(405,270)">
            <g id="eu-star-opt" transform="translate(0,-180)">
              <polygon points="0,-27 7.9,-8.5 28,-6.7 12.7,6.5 17.3,26.1 0,15.7 -17.3,26.1 -12.7,6.5 -28,-6.7 -7.9,-8.5" />
            </g>
            <use href="#eu-star-opt" transform="rotate(30)" />
            <use href="#eu-star-opt" transform="rotate(60)" />
            <use href="#eu-star-opt" transform="rotate(90)" />
            <use href="#eu-star-opt" transform="rotate(120)" />
            <use href="#eu-star-opt" transform="rotate(150)" />
            <use href="#eu-star-opt" transform="rotate(180)" />
            <use href="#eu-star-opt" transform="rotate(210)" />
            <use href="#eu-star-opt" transform="rotate(240)" />
            <use href="#eu-star-opt" transform="rotate(270)" />
            <use href="#eu-star-opt" transform="rotate(300)" />
            <use href="#eu-star-opt" transform="rotate(330)" />
          </g>
        </svg>
      </button>
    </div>
  }
</div>
