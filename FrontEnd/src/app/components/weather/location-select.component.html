<div class="relative block w-full text-left">
  <button
    type="button"
    (click)="toggleMenu()"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="listbox"
    class="flex w-full items-center justify-between gap-2 rounded-lg border border-[#434c5e] bg-[#2e3440] px-3 py-2 text-sm text-[#eceff4]
           hover:border-[#88c0d0]/60 focus:border-[#88c0d0] focus:outline-none transition-colors duration-200 cursor-pointer">
    @if (selectedItem(); as current) {
      <span class="flex min-w-0 items-center gap-2">
        <span class="text-base leading-none shrink-0">{{ symbolEmojiFn()(current.symbolCode) }}</span>
        <span class="truncate font-medium">{{ current.locationName }}</span>
        <span class="shrink-0 text-xs font-semibold text-[#88c0d0] tabular-nums">
          {{ current.temperatureC | number:'1.1-1' }}°C
        </span>
      </span>
    } @else {
      <span class="truncate text-[#d8dee9]">
        {{ 'weather.selectLocation' | translate }}
      </span>
    }

    <svg
      class="h-4 w-4 shrink-0 text-[#d8dee9] transition-transform duration-200"
      [class.rotate-180]="isOpen()"
      viewBox="0 0 20 20"
      fill="currentColor"
      aria-hidden="true">
      <path
        fill-rule="evenodd"
        d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"
        clip-rule="evenodd" />
    </svg>
  </button>

  @if (isOpen()) {
    <div
      role="listbox"
      class="absolute left-0 right-0 z-50 mt-1.5 max-h-64 overflow-y-auto rounded-lg border border-[#434c5e] bg-[#2e3440] p-1">
      <button
        type="button"
        role="option"
        [attr.aria-selected]="selectedId() === null"
        (click)="choose(null)"
        [class.bg-[#3b4252]]="selectedId() === null"
        [class.text-[#eceff4]]="selectedId() === null"
        class="flex w-full items-center justify-between gap-2 rounded-lg px-3 py-2 text-left text-sm text-[#d8dee9]
               hover:bg-[#3b4252] hover:text-[#eceff4] transition-colors duration-150 cursor-pointer">
        <span>{{ 'weather.selectLocation' | translate }}</span>
      </button>

      @for (item of items(); track item.locationId) {
        <button
          type="button"
          role="option"
          [attr.aria-selected]="selectedId() === item.locationId"
          (click)="choose(item.locationId)"
          [class.bg-[#3b4252]]="selectedId() === item.locationId"
          [class.text-[#eceff4]]="selectedId() === item.locationId"
          class="flex w-full items-center justify-between gap-2 rounded-lg px-3 py-2 text-left text-sm text-[#d8dee9]
                 hover:bg-[#3b4252] hover:text-[#eceff4] transition-colors duration-150 cursor-pointer">
          <span class="flex min-w-0 items-center gap-2">
            <span class="text-base leading-none shrink-0">{{ symbolEmojiFn()(item.symbolCode) }}</span>
            <span class="truncate">{{ item.locationName }}</span>
          </span>
          <span class="shrink-0 font-medium text-[#88c0d0] tabular-nums">
            {{ item.temperatureC | number:'1.1-1' }}°C
          </span>
        </button>
      }
    </div>
  }
</div>
