<section class="h-[calc(100dvh-65px)] md:h-[calc(100dvh-73px)] overflow-y-auto no-scrollbar bg-[#2e3440] text-[#d8dee9] px-4 py-8 sm:px-6 md:py-10">  <div class="mx-auto max-w-7xl">
    <div class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between border-b border-[#434c5e] pb-6">
      <div>
        <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-[#eceff4]">
          {{ 'menu.weather' | translate }}
        </h1>
        <p class="mt-2 text-base text-[#88c0d0]">
          {{ 'home.subtitle' | translate }}
        </p>
      </div>

      <button
        type="button"
        (click)="refresh()"
        [disabled]="forecast()?.isLoading() ?? false"
        class="self-start sm:self-auto px-5 py-2.5 rounded-lg font-medium
               bg-[#3b4252] text-[#eceff4] border border-[#4c566a]
               hover:bg-[#434c5e] active:bg-[#4c566a]
               disabled:opacity-50 disabled:cursor-not-allowed
               transition-colors duration-200 cursor-pointer">
        {{ (forecast()?.isLoading() ?? false) ? ('weather.loading' | translate) : ('weather.refresh' | translate) }}
      </button>
    </div>

    <app-forecast />

    <footer class="mt-8 pt-4 border-t border-[#434c5e] flex flex-wrap items-center justify-between gap-2 text-xs sm:text-sm text-[#d8dee9]/75">
      <div>
        <span>{{ 'weather.credit' | translate }}</span>
        <a
          href="https://api.met.no/"
          target="_blank"
          rel="noopener noreferrer"
          class="ml-1 font-medium text-[#88c0d0] hover:text-[#8fbcbb] underline underline-offset-4 transition-colors duration-200">
          MET Norway
        </a>
      </div>

      <div>
        <span>{{ 'weather.license_prefix' | translate }}</span>
        <span class="ml-1 font-medium text-[#eceff4]">
          {{ 'weather.license.name' | translate }}
        </span>
      </div>
    </footer>
  </div>
</section>
